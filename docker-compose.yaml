services:
    postgres:
        image: postgres:18
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: learning
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql
    auth_service:
        build:
            context: .
            dockerfile: ./auth_service/dockerfile
        container_name: auth_service
        env_file:
            - .env
        ports:
            - "8000:8000"
    store_service:
        build:
            context: .
            dockerfile: ./store_service/dockerfile
        container_name: store_service
        env_file:
            - .env
        ports:
            - "8001:8001"
    payment_service:
        build:
            context: .
            dockerfile: ./payment_service/dockerfile
        container_name: payment_service
        env_file:
            - .env
        ports:
            - "8002:8002"
    users_service:
        build:
            context: .
            dockerfile: ./users_service/dockerfile
        container_name: users_service
        env_file:
            - .env
        ports:
            - "8003:8003"
    
    victorialogs:
        image: victoriametrics/victoria-logs:v1.52.0
        container_name: victorialogs
        ports:
            - "9428:9428"
        command:
            - -storageDataPath=/victoria-logs-data
        volumes:
            - vl_data:/victoria-logs-data
        restart: unless-stopped
    
    vmagent:
        image: victoriametrics/vmagent:v1.148.0
        container_name: vmagent
        depends_on:
            - victoriametrics
        ports:
            - "8429:8429"
        command:
            - "-promscrape.config=/etc/vmagent/prometheus.yml"
            - "-remoteWrite.url=http://victoriametrics:8428/api/v1/write"
            - "-promscrape.config.strictParse=false"
        volumes:
            - ./vmagent/prometheus.yml:/etc/vmagent/prometheus.yml:ro
    
    victoriametrics:
        image: victoriametrics/victoria-metrics:v1.148.0
        container_name: victoriametrics
        ports:
            - "8428:8428"
        command:
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod=30d"
        volumes:
            - vm_data:/victoria-metrics-data
        restart: unless-stopped
    
    grafana:
        image: grafana/grafana:13.0
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_AUTH_ANONYMOUS_ENABLED: "false"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro 
        depends_on:
            - victoriametrics
        restart: unless-stopped
    
