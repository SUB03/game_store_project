syntax = "proto3";

package users.v1;

message AddGameToUserRequest {
  string username = 1;
  string appid = 2;
}

message AddGameToUserResponse {}

message HasGameRequest {
  string username = 1;
  int64 appid = 2;
}

message HasGameResponse {
  bool result = 1;
}

service UserService {
  rpc HasGame(HasGameRequest) returns (HasGameResponse);
  rpc AddGameToUser(AddGameToUserRequest) returns (AddGameToUserResponse);
}
